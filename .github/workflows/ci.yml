name: CI

on:
  push:
    branches: [master, main, "claude/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test core and build universal app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install project generator
        run: brew install xcodegen
      - name: Test XpectacleCore
        working-directory: Xpectacle2026/Packages/XpectacleCore
        run: swift test --build-system native
      - name: Generate and build app
        working-directory: Xpectacle2026
        run: |
          xcodegen generate
          xcodebuild -project Xpectacle.xcodeproj -scheme Xpectacle \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO build
